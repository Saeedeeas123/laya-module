# VERIFIED proot/ARM64 settings (2026-08-20 First_App, air-mouse 2026-09). Do NOT remove the aapt2 override.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
# FM-1: AGP would fetch an x86_64 aapt2 from Maven that cannot execute on ARM64.
# Override with the ARM-native binary from build-tools 35.0.1. File MUST be literally named "aapt2".
android.aapt2FromMavenOverride=/root/Android/build-tools/35.0.1/aapt2
android.aapt2DaemonMode=in-process
android.aapt2.process.daemon=false
android.suppressUnsupportedCompileSdk=35
